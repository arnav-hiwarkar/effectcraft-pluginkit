[package]
name = "timewarp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "5f14d2fe2f05a940534903642297c09de3230017" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "5f14d2fe2f05a940534903642297c09de3230017", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace]
