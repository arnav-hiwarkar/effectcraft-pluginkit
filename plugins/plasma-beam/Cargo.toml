[package]
name = "plasma-beam"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "373fcfc761314fb0644158bf7c7bc3e82d1e86b7" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "373fcfc761314fb0644158bf7c7bc3e82d1e86b7", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

