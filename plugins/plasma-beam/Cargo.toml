[package]
name = "plasma-beam"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "5e60bed8599b8550cd069ae55fd3ccc8f47f742a" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "5e60bed8599b8550cd069ae55fd3ccc8f47f742a", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace]
