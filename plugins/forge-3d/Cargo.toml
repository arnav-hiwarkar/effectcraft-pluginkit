[package]
name = "forge-3d"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "c093934bd69404b4a5b1db0acb48c4cf57d35d72" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "c093934bd69404b4a5b1db0acb48c4cf57d35d72", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

