[package]
name = "forge-3d"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "83a056651132ac0521ffd2bfc71db9b564053fbc" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "83a056651132ac0521ffd2bfc71db9b564053fbc", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace]
