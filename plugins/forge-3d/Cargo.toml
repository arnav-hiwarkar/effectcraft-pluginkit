[package]
name = "forge-3d"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
craft-plugin = { path = "../../crates/plugin-sdk" }

[dev-dependencies]
craft-plugin-host = { path = "../../crates/plugin-host", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

