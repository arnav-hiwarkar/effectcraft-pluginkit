[package]
name = "forge-3d"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "02975668d7c1997ca12c4a39712a8c9addc6a910" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "02975668d7c1997ca12c4a39712a8c9addc6a910", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

