[package]
name = "retro"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "e61a49f06bbd1c425b5387836bd42d916845e46b" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "e61a49f06bbd1c425b5387836bd42d916845e46b", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

