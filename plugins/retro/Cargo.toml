[package]
name = "retro"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "03751585476a6d47935eb9f38e49557195969dd0" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "03751585476a6d47935eb9f38e49557195969dd0", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

