[package]
name = "cookbook"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "5c73277bf2e1935bd607c18268cfdaac9995c9ec" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "5c73277bf2e1935bd607c18268cfdaac9995c9ec", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace]
