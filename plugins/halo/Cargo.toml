[package]
name = "halo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "ace31eeefed665e72cb374c629352acc3c4621c7" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "ace31eeefed665e72cb374c629352acc3c4621c7", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

