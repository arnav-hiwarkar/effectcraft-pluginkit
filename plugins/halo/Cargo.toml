[package]
name = "halo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "f142cc4ba652fcc34cec1cd8a7bca19d47b2c16e" }

[dev-dependencies]
craft-plugin-host = { git = "https://github.com/arnav-hiwarkar/craft-libs-plugin-beta", rev = "f142cc4ba652fcc34cec1cd8a7bca19d47b2c16e", features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

