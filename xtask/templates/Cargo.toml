[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
craft-plugin = { {{kit}} }

[dev-dependencies]
craft-plugin-host = { {{kit}}, features = ["testing"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[workspace]
