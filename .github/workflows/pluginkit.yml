name: Plugin kit

on:
  push:
    branches: [kit, pluginkit, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluginkit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-checks') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: checks
      - name: Layers
        run: cargo run --quiet --package xtask -- layers
      - name: Assets are attributed
        run: cargo run --quiet --package xtask -- assets
      - name: Kit rev is pinned once
        run: cargo run --quiet --package xtask -- kit-rev --check
      - name: Format
        run: cargo fmt --check --all
      - name: Lint
        run: cargo clippy -p effectcraft-plugin -p effectcraft-effects -p effectcraft-gpu -p effectcraft-engine -p effectcraft-automation -p effectcraft-render -p effectcraft-project -p effectcraft-cli -p effectcraft-script -p effectcraft-ui-egui -p xtask --all-targets --keep-going -- -D warnings
      - name: Web build
        run: cargo run --quiet --package xtask -- wasm
      - name: Desktop app builds
        run: cargo check -p effectcraft

  package:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-package') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: package
      - name: Build the app, the CLI and the plugin helper
        run: cargo build -p effectcraft -p effectcraft-cli -p effectcraft-plugin-helper
      - name: Package the Linux tarball
        run: EFFECTCRAFT_BIN_DIR=target/debug packaging/linux/package.sh --skip-build --formats tar
      - name: The helper is beside the app and the CLI in the tarball
        run: |
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir "$unpacked"
          tar -xzf dist/release/effectcraft-*-linux-*.tar.gz -C "$unpacked" --strip-components=1
          bash -c '. packaging/env.sh && require_helper_beside "$1/bin/effectcraft" "$1/bin/effectcraft-cli"' _ "$unpacked"
          echo "UNPACKED=$unpacked" >> "$GITHUB_ENV"
      - name: A native plugin runs through the helper found beside the app
        run: |
          exe=$(cargo test -p effectcraft-plugin --test it --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and .target.name == "it" and .executable != null) | .executable')
          cp "$exe" "$UNPACKED/bin/it"
          rustup run stable env -u CRAFT_PLUGIN_HELPER "$UNPACKED/bin/it" --exact render::a_generator_that_ignores_its_input_and_reports_what_it_drew_renders_the_same_comp_sandboxed_and_native

  tests:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-tests') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: tests
      - name: Adapter tests
        run: cargo test -p effectcraft-plugin
      - name: Engine, project, effects, render, raster, automation, script, CLI and xtask
        run: |
          cargo test -p effectcraft-engine -p effectcraft-project -p effectcraft-effects --lib
          cargo test -p effectcraft-render -p effectcraft-raster -p effectcraft-automation -p effectcraft-script -p effectcraft-cli -p xtask
      - name: GPU plugin tests
        run: cargo test -p effectcraft-gpu --lib -- plugin wgsl_float_literals_fit_f32 opengl_adapters_get_cpu_compositing_at_once

  gpu-bench:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-gpu-bench') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: gpu-bench
      - name: GPU counters and pixels of the plugin stacks against the baseline
        run: cargo run --quiet -p effectcraft-plugin --example gpu_bench -- --json gpu-bench-out.json --check bench/gpu-baseline.json
      - name: Upload the measured counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-bench-out
          path: gpu-bench-out.json
          if-no-files-found: ignore

  ui:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-ui') }}
    name: ui (${{ matrix.partition }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: ui
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150
      - name: Japanese and Chinese fonts the text tests lay out
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: UI tests
        run: |
          (while true; do echo "::group::resources $(date -u +%T)"; free -m; df -h /; echo "::endgroup::"; sleep 60; done) &
          monitor=$!
          trap 'kill $monitor' EXIT
          cargo nextest run -p effectcraft-ui-egui --no-fail-fast --partition count:${{ matrix.partition }}/3
      - name: UI doctests
        if: matrix.partition == 1
        run: cargo test -p effectcraft-ui-egui --doc
      - name: Kernel log after a failure
        if: failure()
        run: sudo dmesg | tail -50

  plugins:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-plugins') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: plugins
      - name: Plugins end to end
        run: ./plugins/e2e.sh
      - name: Reference plugin frames through the kit test harness
        run: ./plugins/goldens.sh
      - name: Plugin manifests pin the workspace kit and check crates keep a current lock file
        run: python3 plugins/relock-checks.py --check
      - name: New plugin templates and the cookbook
        run: ./plugins/new-plugin-check.sh
      - name: Plugin crate tests
        run: |
          for manifest in plugins/*/Cargo.toml; do
            cargo test --manifest-path "$manifest"
          done

  kit:
    if: ${{ !contains(github.event.head_commit.message, 'jobs:') || contains(github.event.head_commit.message, 'job-kit') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Cargo.lock
          sparse-checkout-cone-mode: false
      - name: The craft-extensions commit this workspace pins
        id: pin
        run: |
          rev=$(grep -A2 '^name = "craft-plugin"$' Cargo.lock | sed -n 's|^source = "git+https://github.com/arnav-hiwarkar/craft-extensions-plugin-beta?branch=kit#\([0-9a-f]\{40\}\)"$|\1|p')
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: arnav-hiwarkar/craft-extensions-plugin-beta
          ref: ${{ steps.pin.outputs.rev }}
          path: craft-extensions
      - name: Install Rust targets and components
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: craft-extensions
      - name: Kit lint
        working-directory: craft-extensions
        run: cargo clippy -p craft-plugin -p craft-plugin-host -p craft-plugin-ui -p craft-plugin-helper -p craft-ext-core -p craft-ext-store -p craft-ext-market -p craft-ext-manager -p craft-ext-cli --all-targets --all-features -- -D warnings
      - name: Kit and store tests
        working-directory: craft-extensions
        run: cargo test -p craft-plugin -p craft-plugin-host -p craft-plugin-ui -p craft-plugin-helper -p craft-ext-core -p craft-ext-store -p craft-ext-market -p craft-ext-manager -p craft-ext-cli --all-features
