[package]
name = "effectcraft-plugin"
description = "EffectCraft's side of the Craft Plugin Kit: plugin effects in the effect registry, plugin commands and panels over engine commands, installed-plugin management"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-plugin-host = { workspace = true }
effectcraft-automation = { workspace = true }
effectcraft-engine = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
craft-plugin-host = { workspace = true, features = ["testing"] }
effectcraft-host = { workspace = true }
effectcraft-gpu = { workspace = true }
tempfile = { workspace = true }
exr = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
